# inventory.local.ini — use this when running the playbook directly on the Pi
#
# Usage:
#   sudo ansible-playbook -i inventory.local.ini rpi_harden.yml
#
# This tells Ansible to connect to the local machine without SSH.
# No IP address, no SSH port, no credentials required.
# Run as root (sudo) so become: true tasks work without a password prompt.
#
# IMPORTANT: Also set deployment_mode: "local" in rpi_harden.yml vars block.

[raspberrypis]
localhost ansible_connection=local
